  <!-- ===== テキスト ===== -->
  <g font-family="'Helvetica Neue', Arial, sans-serif">
    <!-- メインタイトル -->
    <text x="716" y="262" font-size="118" font-weight="800" fill="#B2692A" letter-spacing="-1"><tspan fill="#5A8BD8">Y</tspan>AML <tspan fill="#5A8BD8">API</tspan> ome<tspan fill="#5A8BD8">LET</tspan></text>
    <!-- 小見出し -->
    <text x="724" y="348" font-size="42" fill="#7C736B">Requests &amp; action chains, wrapped in YAML</text>
    <!-- 下段：正式タイトル -->
    <text x="726" y="420" font-size="29" fill="#7C736B" letter-spacing="1">a lightweight Yaml-driven API request and action-chain runner</text>
  </g>

  <!-- 左上バッジ -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#7C736B" text-anchor="middle">
    <text x="92" y="82" font-size="28">YAML</text>
    <text x="92" y="112" font-size="28">Kitchen</text>
  </g>

  <!-- お菓子の右下：プロダクト名 -->
  <text x="650" y="518" text-anchor="end" font-size="72" font-weight="700" fill="#A4723B" font-family="ui-monospace, Menlo, Consolas, monospace">yapilet</text>
