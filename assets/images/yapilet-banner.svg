    <path d="M212 392 C220 440 255 472 300 482 C330 488 360 470 380 445 C330 455 260 440 212 392 Z" fill="#E6AC50" opacity="0.85"/>
    <path d="M272 520 C200 502 158 425 160 340 C163 230 262 128 402 92 C505 66 625 68 704 104"
